apiVersion: v1
kind: Namespace
metadata: { name: maas-db }
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata: { name: maas-db, namespace: maas-db }
spec:
  instances: 1
  bootstrap: { initdb: { database: maas, owner: maas_api } }
  storage: { size: 20Gi }
  resources:
    requests: { cpu: 250m, memory: 1Gi }
    limits: { cpu: "2", memory: 4Gi }
