# Images built on the hub into its internal registry until GitHub Actions publish them to
# ghcr.io/ai-grid-cloud. Rebuild: oc start-build <name> -n ai-grid, then
# oc rollout restart deploy/ai-grid-provider-console -n ai-grid.
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata: { name: ai-grid-provider-console }
spec: { lookupPolicy: { local: true } }
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata: { name: ai-grid-backend }
spec: { lookupPolicy: { local: true } }
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata: { name: ai-grid-provider-console }
spec:
  source: { git: { uri: https://github.com/ai-grid-cloud/ai-grid-provider-console.git, ref: main } }
  strategy: { dockerStrategy: { dockerfilePath: Dockerfile } }
  output: { to: { kind: ImageStreamTag, name: "ai-grid-provider-console:latest" } }
  resources: { requests: { cpu: "1", memory: 2Gi }, limits: { memory: 6Gi } }
  triggers: [{ type: ConfigChange }]
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata: { name: ai-grid-backend }
spec:
  source: { git: { uri: https://github.com/ai-grid-cloud/ai-grid-provider-backend.git, ref: main } }
  strategy:
    dockerStrategy:
      dockerfilePath: Containerfile
      buildArgs:
        - { name: BUILDPLATFORM, value: linux/amd64 }
        - { name: TARGETOS, value: linux }
        - { name: TARGETARCH, value: amd64 }
  output: { to: { kind: ImageStreamTag, name: "ai-grid-backend:latest" } }
  resources: { requests: { cpu: "1", memory: 1Gi }, limits: { memory: 4Gi } }
  triggers: [{ type: ConfigChange }]
