# The console pod as the console repository defines it (kube-auth-proxy, BFF, ai-grid-backend), at its
# main branch, with images from the BuildConfigs in builds.yaml. Secrets ai-grid-provider-console-oauth
# and ai-grid-backend-keycloak, and the OAuthClient, come from bootstrap/60-console.sh, not git.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai-grid
resources:
  - https://github.com/ai-grid-cloud/ai-grid-provider-console//manifests/base?ref=main
  - builds.yaml
# ImageStream names, resolved to the latest build's digest when a pod starts (lookupPolicy local and
# the resolve-names annotation below), so a rebuild needs only a rollout restart and git never drifts.
images:
  - { name: quay.io/cfchase/ai-grid-provider-console, newName: ai-grid-provider-console, newTag: latest }
  - { name: quay.io/ai-grid-cloud/ai-grid-backend, newName: ai-grid-backend, newTag: latest }
patches:
  - target: { kind: Deployment, name: ai-grid-provider-console }
    patch: |
      - op: add
        path: /spec/template/metadata/annotations
        value: { alpha.image.policy.openshift.io/resolve-names: "*" }
      # Container 2 is ai-grid-backend. Its REST gateway and Swagger UI default to :8081 on every
      # interface, unauthenticated; keep them on loopback like its gRPC port.
      - op: test
        path: /spec/template/spec/containers/2/name
        value: ai-grid-backend
      - op: add
        path: /spec/template/spec/containers/2/args/-
        value: --http-listen-address=127.0.0.1:8081
