# Default image source: ghcr.io/ai-grid-cloud, the packages the repositories' GitHub Actions publish to
# from main (console PR 32, backend PR 8).
# Pin sha-<full commit>@<digest>: tags can be overwritten, so the digest is what's deployed, and the tag
# says which commit it is. Never latest or pr-<N>. Bump: take the sha-<commit> tag CI published for the
# merge commit and its digest (skopeo inspect docker://<image>:<tag> | jq -r .Digest), change both here, and move the base ref in ../../kustomization.yaml
# and the refs in ../../builds.yaml to the same commits.
# UAT 2026-10-22 (integration/demo1 only): PR images, pinned by digest, not main sha- tags. Console PR 42
# (head 0d27b15 with main's PR 56, built as merge 4575898) and backend PR 16 (head 8c1a1bc, built as merge 78db415). Replace both
# with main's sha-<commit>@<digest> after they merge. Both are copies in the hub's internal registry
# (oc tag --source=docker <ghcr image>@<digest> ai-grid/<stream>:uat-pr16|uat-pr42 --reference-policy=local),
# because publish-pr-image deletes a pr-<N> digest when the PR is pushed again (it broke the backend pin
# 2026-10-22). Backend: pr-16 rebuilt from merge 78db415 (head 8c1a1bc), same code as before. The base ref stays f2b1ab1: main changed only a comment there.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target: { kind: Deployment, name: ai-grid-provider-console }
    patch: |
      - { op: test, path: /spec/template/spec/containers/1/name, value: bff }
      - { op: replace, path: /spec/template/spec/containers/1/image, value: "image-registry.openshift-image-registry.svc:5000/ai-grid/ai-grid-provider-console@sha256:ce38694e3f9e058a031e0a28e9d158572e87c4f50f3d17d685c1a648df2dd358" }
      - { op: test, path: /spec/template/spec/containers/2/name, value: ai-grid-backend }
      - { op: replace, path: /spec/template/spec/containers/2/image, value: "image-registry.openshift-image-registry.svc:5000/ai-grid/ai-grid-backend@sha256:004b7d33d0eb3dbaef59ae45cd205a99f12b85aebf5e8c00ccba5e0ce60d041e" }
