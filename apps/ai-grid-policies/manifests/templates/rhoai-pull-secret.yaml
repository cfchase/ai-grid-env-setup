{{- if eq .Values.pullSecretMode "policy" }}
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: rhoai-pull-secret
  namespace: ai-grid-policies
  annotations: { policy.open-cluster-management.io/description: "Merge the deployer's quay.io/rhoai auth into each spoke's global pull secret" }
spec:
  remediationAction: {{ .Values.pullSecretRemediation }}
  disabled: false
  policy-templates:
    # 1. Copy the credential to the spoke. protect keeps it encrypted in the replicated Policy;
    #    it decrypts only in a plain field like this one, not inside object-templates-raw.
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata: { name: rhoai-quay-pull-copy }
        spec:
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata: { name: aigrid-rhoai-quay-pull, namespace: openshift-config }
                type: Opaque
                stringData:
                  # The hub's fromSecret yields the stored value: base64("user:token"), a dockerconfigjson auth.
                  auth: {{`'{{hub fromSecret "ai-grid-policies" "rhoai-quay-pull" "auth" | protect hub}}'`}}
    # 2. Merge that local copy into the global pull secret, keeping every other registry.
    - extraDependencies:
        - { apiVersion: policy.open-cluster-management.io/v1, kind: ConfigurationPolicy, name: rhoai-quay-pull-copy, compliance: Compliant }
      objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata: { name: rhoai-pull-secret }
        spec:
          severity: high
          object-templates-raw: |
{{`            {{- $cfg := fromSecret "openshift-config" "pull-secret" ".dockerconfigjson" | base64dec | fromJson }}
            {{- $auth := fromSecret "openshift-config" "aigrid-rhoai-quay-pull" "auth" | base64dec }}
            {{- $_ := set $cfg.auths "quay.io/rhoai" (dict "auth" $auth) }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata: { name: pull-secret, namespace: openshift-config }
                type: kubernetes.io/dockerconfigjson
                data:
                  .dockerconfigjson: '{{ $cfg | toRawJson | base64enc }}'`}}
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata: { name: rhoai-pull-secret, namespace: ai-grid-policies }
placementRef: { apiGroup: cluster.open-cluster-management.io, kind: Placement, name: ai-grid-spokes }
subjects: [{ apiGroup: policy.open-cluster-management.io, kind: Policy, name: rhoai-pull-secret }]
{{- end }}
