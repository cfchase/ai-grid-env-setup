{{- if eq .Values.pullSecretMode "policy" }}
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: rhoai-pull-secret
  namespace: ai-grid-policies
  annotations: { policy.open-cluster-management.io/description: "Merge the deployer's quay.io/rhoai auth into each spoke's global pull secret" }
spec:
  remediationAction: {{ .Values.pullSecretRemediation }}
  disabled: false
  policy-templates:
    # Merge the quay.io/rhoai auth into the global pull secret, keeping every other registry.
    # The hub's fromSecret yields the stored value, base64("user:token"), which is what the auth holds.
    # Not protect: ACM leaves "$ocm_encrypted:..." undecrypted here (tested 2026-10-19), so the
    # replicated Policy carries the credential in clear, readable by the same cluster admins who can
    # read the pull secret it ends up in.
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata: { name: rhoai-pull-secret }
        spec:
          severity: high
          object-templates-raw: |
{{`            {{- $cfg := fromSecret "openshift-config" "pull-secret" ".dockerconfigjson" | base64dec | fromJson }}
            {{- $auth := "{{hub fromSecret "ai-grid-policies" "rhoai-quay-pull" "auth" hub}}" }}
            {{- $_ := set $cfg.auths "quay.io/rhoai" (dict "auth" $auth) }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata: { name: pull-secret, namespace: openshift-config }
                type: kubernetes.io/dockerconfigjson
                data:
                  .dockerconfigjson: '{{ $cfg | toRawJson | base64enc }}'`}}
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata: { name: rhoai-pull-secret, namespace: ai-grid-policies }
placementRef: { apiGroup: cluster.open-cluster-management.io, kind: Placement, name: ai-grid-spokes }
subjects: [{ apiGroup: policy.open-cluster-management.io, kind: Policy, name: rhoai-pull-secret }]
{{- end }}
