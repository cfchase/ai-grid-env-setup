apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata: { name: rhai-metrics, namespace: ai-grid-policies }
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata: { name: rhai-metrics }
        spec:
          severity: low
          # ACM's metrics collector (namespace open-cluster-management-agent-addon) federates OpenShift
          # AI's collector on 8890 for the hub's ScrapeConfig rhai-metrics. NetworkPolicies add up, so
          # this sits beside the operator's own policy without being reconciled away.
          object-templates:
            - complianceType: mustonlyhave
              objectDefinition:
                apiVersion: networking.k8s.io/v1
                kind: NetworkPolicy
                metadata: { name: allow-acm-rhai-metrics, namespace: redhat-ods-monitoring }
                spec:
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/instance: redhat-ods-monitoring.data-science-collector
                      app.kubernetes.io/component: opentelemetry-collector
                  policyTypes: [Ingress]
                  ingress:
                    - from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: open-cluster-management-agent-addon } } }]
                      ports: [{ port: 8890, protocol: TCP }]
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata: { name: rhai-metrics, namespace: ai-grid-policies }
placementRef: { apiGroup: cluster.open-cluster-management.io, kind: Placement, name: ai-grid-spokes }
subjects: [{ apiGroup: policy.open-cluster-management.io, kind: Policy, name: rhai-metrics }]
