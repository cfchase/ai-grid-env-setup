apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata: { name: tenant-portal-idp, namespace: ai-grid-policies }
spec:
  remediationAction: {{ .Values.portalIdpRemediation }}
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata: { name: tenant-portal-idp }
        spec:
          severity: medium
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata: { name: ai-grid-idp, namespace: openshift-config }
                type: Opaque
                # A hub-template fromSecret arrives encrypted and decrypts on the spoke to the Secret's
                # base64 data, which is what a data field takes (no protect: it would double-encrypt).
                data:
                  clientSecret: {{`'{{hub fromSecret "ai-grid-policies" (printf "portal-idp-%s" .ManagedClusterName) "clientSecret" hub}}'`}}
            - complianceType: musthave
              objectDefinition:
                apiVersion: config.openshift.io/v1
                kind: OAuth
                metadata: { name: cluster }
                spec:
                  identityProviders:
                    - name: ai-grid
                      type: OpenID
                      mappingMethod: claim
                      openID:
                        clientID: {{`'ocp-{{hub .ManagedClusterName hub}}'`}}
                        clientSecret: { name: ai-grid-idp }
                        issuer: {{`'{{hub fromConfigMap "ai-grid-policies" "ai-grid-hub-info" "tenantIssuer" hub}}'`}}
                        claims:
                          preferredUsername: [preferred_username]
                          name: [name]
                          email: [email]
                          groups: [groups]
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata: { name: tenant-portal-idp, namespace: ai-grid-policies }
placementRef: { apiGroup: cluster.open-cluster-management.io, kind: Placement, name: ai-grid-ingress }
subjects: [{ apiGroup: policy.open-cluster-management.io, kind: Policy, name: tenant-portal-idp }]
