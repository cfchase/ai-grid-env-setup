{{- if .Values.catalogRepo }}
# Subscriptions the provider console creates in git mode: the backend's git writer commits one file per
# subscription, catalog/subscriptions/<id>.yaml (the MaaSSubscription and its <id>-policy MaaSAuthPolicy,
# namespace models-as-a-service), to the cluster repository. Every entry spoke gets all of them, like the
# tenant intent. Prune follows the writer: deleting a subscription deletes its file, then its objects;
# allowEmpty lets that happen for the last one too (Argo CD's automated sync otherwise refuses to prune
# down to nothing). Until the writer's first commit the path doesn't exist and the apps show a
# ComparisonError, which clears on that commit.
# The catalog apps' own project: a repository the backend writes to must not deliver anything else. Only
# the cluster repository as a source, only namespace models-as-a-service on the spokes, no cluster-scoped
# kinds, and only the MaaS kinds the writer commits (maas.opendatahub.io, both namespaced). Argo CD refuses
# any other object in that path, and any namespace but these two.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: ai-grid-catalog
  namespace: openshift-gitops
  annotations: { argocd.argoproj.io/sync-wave: "-1" }
spec:
  description: Subscriptions from the cluster repository's catalog, written by the backend's git writer
  sourceRepos: [{{ .Values.catalogRepo | quote }}]
  destinations:
    - { server: "*", namespace: models-as-a-service }
    - { server: "*", namespace: ai-grid-internal-models }
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - { group: maas.opendatahub.io, kind: MaaSSubscription }
    - { group: maas.opendatahub.io, kind: MaaSAuthPolicy }
    # Models (catalog-models.yaml): the deployment on inference spokes, the MaaS entry on ingress ones.
    - { group: serving.kserve.io, kind: LLMInferenceService }
    - { group: networking.k8s.io, kind: NetworkPolicy }
    - { group: inference.opendatahub.io, kind: ExternalModel }
    - { group: maas.opendatahub.io, kind: MaaSModelRef }
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata: { name: ai-grid-catalog-subscriptions, namespace: openshift-gitops }
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy: { preserveResourcesOnDeletion: true }
  generators:
    {{- include "ai-grid-spokes.generators" (list "ingress" "combined") | nindent 4 }}
  template:
    metadata: { name: 'subscriptions-{{`{{.name}}`}}' }
    spec:
      project: ai-grid-catalog
      source:
        repoURL: {{ .Values.catalogRepo | quote }}
        targetRevision: {{ required "catalogRef" .Values.catalogRef | quote }}
        path: catalog/subscriptions
        directory: { include: "*.yaml" }
      destination: { server: '{{`{{.server}}`}}', namespace: models-as-a-service }
      syncPolicy:
        automated: { selfHeal: true, prune: true, allowEmpty: true }
        retry: { limit: -1, refresh: true, backoff: { duration: 30s, factor: 2, maxDuration: 10m } }
        syncOptions: [SkipDryRunOnMissingResource=true]
{{- end }}
