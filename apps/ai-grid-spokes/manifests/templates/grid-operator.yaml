apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata: { name: ai-grid-grid-operator, namespace: openshift-gitops }
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy: { preserveResourcesOnDeletion: true }
  generators:
    {{- include "ai-grid-spokes.generators" (list) | nindent 4 }}
  template:
    metadata: { name: 'grid-operator-{{`{{.name}}`}}' }
    spec:
      project: default
      source:
        repoURL: ghcr.io/praxis-proxy/charts
        chart: grid-operator
        targetRevision: "{{ .Values.gridVersion }}"
        helm:
          releaseName: grid-operator
          values: |
            rbac: { enrollmentNamespace: grid-enrollment }
            {{`{{- if ne (index .metadata.labels "ai-grid/role") "ingress" }}`}}
            grid:
              id: {{ .Values.gridId }}
              network: {{ .Values.gridNetwork }}
              # Signal-based routing: each site serves its signals (load, readiness) on an mTLS
              # endpoint (Service grid-operator-signals, a load balancer like the gossip one on remote
              # sites), operators poll their peers, and the consumer gateway routes each model to the
              # least-loaded site from its operator's serving config (grid-consumer.yaml gridServing).
              signals: poll
              # The model this site serves, registered as its InferenceProvider.
              providers:
                {{ .Values.modelName }}:
                  model: {{ .Values.modelName }}
                  backendKind: local
                  endpoint: https://{{ .Values.modelName }}-kserve-workload-svc.aigrid-models.svc:8000
                  # The routing identity the consumer picks: its backend for this site, which the
                  # consumer keys by site name. Every model on a site shares it, so the consumer's
                  # backends stay one per site however many models there are.
                  clusterName: '{{`{{.name}}`}}'
                  # The scheduler's load, without which the provider publishes none and the grid
                  # can't balance (MetricsNotConfigured). The operator scrapes with the chart's
                  # metrics-scraper ServiceAccount token. allowPlaintext: the scheduler's 9090
                  # declares no appProtocol, so the token crosses in the clear inside the cluster.
                  metricsConfig:
                    endpoint: http://{{ .Values.modelName }}-epp-service.aigrid-models.svc:9090
                    path: /metrics
                    timeout: 2s
                    auth: { type: serviceAccountToken, allowPlaintext: true }
            # The provider gateway's fixed ClusterIP: the address the operator advertises and probes
            # (no LoadBalancer to discover), which moves the site from Discovered to Active.
            {{- /* An inference site in providerGlobalIPs advertises its Globalnet address instead,
                   the one other clusters reach. */}}
            gateway: { address: "{{ include "ai-grid-spokes.bySite" (list .Values.providerGlobalIPs .Values.providerIP) }}:8443" }
            {{`{{- else }}`}}
            grid: { id: {{ .Values.gridId }}, network: {{ .Values.gridNetwork }} }
            {{`{{- end }}`}}
            {{`{{- if eq .name "local-cluster" }}`}}
            # One site needs no gossip load balancer (AWS's default ELB carries no UDP, and the
            # operator waits for its address); Task 11 switches the hub to an NLB when a peer joins.
            swim: { siteName: local-cluster, service: { type: ClusterIP } }
            enrollment: { enabled: false }
            {{`{{- else }}`}}
            swim: { siteName: {{`{{.name}}`}}, service: { type: {{ .Values.remoteSwimServiceType }} } }
            platform: aws
            loadBalancerScope: {{ .Values.swimLoadBalancerScope }}
            enrollment: { enabled: true, url: "https://{{ .Values.enrollHost }}" }
            {{`{{- end }}`}}
      destination: { server: '{{`{{.server}}`}}', namespace: {{ .Values.gridNs }} }
      syncPolicy:
        automated: { selfHeal: true }
        retry: { limit: -1, refresh: true, backoff: { duration: 30s, factor: 2, maxDuration: 10m } }
        syncOptions: [CreateNamespace=true]
{{- /* An ApplicationSet expression for the cluster's value in a map of site to value, else the
       default; with an empty map, the default alone. Argument: (list map default). */ -}}
{{- define "ai-grid-spokes.bySite" -}}
{{- $m := first . }}
{{- range $s, $v := $m }}{{`{{ if eq .name "`}}{{ $s }}{{`" }}`}}{{ $v }}{{`{{ else }}`}}{{ end }}{{ last . }}{{ range $m }}{{`{{ end }}`}}{{ end }}
{{- end }}
