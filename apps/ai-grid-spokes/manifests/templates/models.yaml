apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata: { name: ai-grid-models, namespace: openshift-gitops }
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy: { preserveResourcesOnDeletion: true }
  generators:
    - clusters:
        selector:
          matchLabels: { apps.open-cluster-management.io/acm-cluster: "true", ai-grid/enabled: "true" }
          matchExpressions: [{ key: ai-grid/role, operator: In, values: [inference, combined] }]
  template:
    metadata: { name: 'models-{{`{{.name}}`}}' }
    spec:
      project: default
      source: { repoURL: {{ required "gitRepo" .Values.gitRepo | quote }}, targetRevision: {{ required "gitRef" .Values.gitRef | quote }}, path: 'spokes/clusters/{{`{{.name}}`}}/models' }
      destination: { server: '{{`{{.server}}`}}' }
      syncPolicy:
        automated: { selfHeal: true, prune: true }
        retry: { limit: -1, backoff: { duration: 30s, factor: 2, maxDuration: 10m } }
        syncOptions: [CreateNamespace=true, SkipDryRunOnMissingResource=true]
