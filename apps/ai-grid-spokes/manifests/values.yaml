# gitRepo and gitRef come from the root ApplicationSet as Helm parameters (bootstrap/00-gitops.sh).
# The cluster repository the backend's git writer commits to (catalog/subscriptions/ in git mode). Empty:
# no catalog apps. With the demo-cluster split these become root parameters, like gitRepo and gitRef.
catalogRepo: https://github.com/ai-grid-cloud/demo-cluster.git
catalogRef: main
odhGitopsRef: "e6fe1032cbb35ba4de7e3c053dde425cbe63fffe"         # odh-gitops main, 2026-10-21 (PR 181; DSC aiGrid left unset, see spokes/platform/values/common.yaml)
gridVersion: 0.2.2             # the grid release; grid-enrollment's chart version is in apps/grid-enrollment
# The grid gateway image by digest (the v<gridVersion> tag's multi-arch index); bump with gridVersion:
# skopeo inspect --raw docker://ghcr.io/praxis-proxy/grid-gateway:v<gridVersion> | shasum -a 256
gridGatewayDigest: sha256:9cc6573fe782a8c43883d57052cb87f3a343c803cb379a97a742036941ca725c
gridNs: grid
gridId: aigrid-demo
gridNetwork: grid
modelName: facebook-opt-125m
# Fixed ClusterIPs (in 172.30.0.0/16) the grid gateways dial, since they refuse in-cluster host names:
# the model's grid-backend Service (spokes/models) and the provider gateway's (spokes/grid/provider).
modelBackendIP: 172.30.255.10
providerIP: 172.30.255.11
# D8: the hub site's certificate digest, which the gateways pin. It's a fingerprint, not a secret or
# a host name; it changes on every rebuild: copy it from ConfigMap ai-grid-policies/ai-grid-hub-info.
hubSiteDigest: "e11b9e876791edb1062b1fe34080ecfbcc75b52e4c8fe2639701fe36088ea5b9"
# A remote site's own certificate digest, which its provider gateway pins (its consumer presents
# that site's identity). It exists only once the site has enrolled: bootstrap/50-grid-hub-info.sh
# prints it from the site's GridNetwork; commit it here. Until then the provider pins 64 zeros and
# refuses every caller.
siteDigests:
  site-a: "0cbd93eaf3bf393c2293412f42fe0ed2f2f48d75d91408ddeefee9f689507d25"
  site-b: "83365ddd6c8967f7c1eb229579c180d44f79872921058a1d692c010f9ae3de4e"
# Inference sites that other clusters' consumers call: the Globalnet address of each one's exported
# provider Service (spokes/grid/provider-export). A literal IP, because the gateways refuse host
# names. It changes on every build: bootstrap/50-grid-hub-info.sh prints it once the site is added;
# commit it here. Empty: no site is called from another; a combined site's consumer calls only its own
# provider, and an ingress spoke can't render a consumer at all (it has no backend), so add an
# inference site before an ingress one.
providerGlobalIPs:
  site-b: "242.2.255.253"
# The sites whose consumers call those inference sites: every ingress and combined spoke, and
# local-cluster while the hub is one. Each inference provider pins exactly these sites' digests
# (verify/05 checks the list against the spokes' roles).
consumerSites:
  - site-a
# Remote spokes enroll with the hub's enrollment over Submariner (apps/grid-enrollment).
enrollHost: local-cluster.grid-enrollment.grid-enrollment.svc.clusterset.local:8443
# A remote site's gossip Service: LoadBalancer (an NLB, from platform: aws), so remote sites, such as
# an inference site and the ingress site it serves, gossip with each other. With a single remote site
# ClusterIP also works and skips the NLB, which holds the operator until AWS gives it an address.
remoteSwimServiceType: LoadBalancer
# Reach of a remote site's gossip and signals load balancers (the grid chart's loadBalancerScope; it
# applies only to a LoadBalancer Service). external is an internet-facing NLB, which grid v0.2.0 always
# made; v0.2.1 and later default to internal, an NLB reachable only inside its own VPC, and each spoke is
# a separate cluster in its own VPC. AWS reads the scope only when it creates the load balancer: changing
# it means deleting the Service. (From env PR 12.)
swimLoadBalancerScope: external
