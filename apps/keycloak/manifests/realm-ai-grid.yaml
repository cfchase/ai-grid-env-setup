apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakRealmImport
metadata:
  name: ai-grid
  namespace: keycloak
  annotations: { argocd.argoproj.io/sync-wave: "3" }
spec:
  keycloakCRName: maas-keycloak
  realm:
    realm: ai-grid
    enabled: true
    organizationsEnabled: true
    # Slow password guessing: after 10 failures a user waits, up to 15 minutes; never locked for good.
    bruteForceProtected: true
    permanentLockout: false
    failureFactor: 10
    waitIncrementSeconds: 60
    maxFailureWaitSeconds: 900
    # The broker realm (ODH-ADR-MS-0007, after Lindani Phiri's maas-portal-integration-poc `saas` realm):
    # each organization signs in through its own identity provider, chosen by email domain, and the MaaS
    # claims come from that provider. No organizations here: the provider console creates them, or a
    # cluster repository's demo tenants do (docs/runbook.md, "Organizations"). For each organization's
    # identity provider, the broker, not the provider, sets the organization claim and the groups: a
    # hardcoded maas_orgs attribute mapper, and group mappers into the organization's groups. An
    # organization's group is named after the organization, never its ID (Keycloak keeps a hidden group
    # per organization named after the ID), and each leaf group carries attribute maas_groups,
    # `<organization id>/<group>` (ODH-ADR-MS-0007's canonical form), which scope maas emits as the
    # token's groups claim. Brokered usernames are `<provider alias>.<subject>`, so MaaS's user key never
    # repeats across organizations.
    # First sign-in through a provider only creates the user and makes them a member of that provider's
    # organization. Keycloak's default flow would show a profile form when an attribute is missing (where
    # the user could type any username) and offer to link an existing account with the same email (which
    # would merge organizations); here a duplicate username or email fails instead.
    authenticationFlows:
      - alias: ai-grid first broker login
        description: Create the brokered user if unique, then add them to the provider's organization
        providerId: basic-flow
        topLevel: true
        builtIn: false
        authenticationExecutions:
          - { authenticator: idp-create-user-if-unique, requirement: REQUIRED, priority: 10, authenticatorFlow: false, userSetupAllowed: false }
          - { authenticator: idp-add-organization-member, requirement: REQUIRED, priority: 20, authenticatorFlow: false, userSetupAllowed: false }
    clientScopes:
      - name: maas
        protocol: openid-connect
        # Listing clientScopes replaces Keycloak's built-in ones (basic, profile), so this scope also
        # carries sub and preferred_username, which MaaS reads as the user's name.
        protocolMappers:
          - { name: sub, protocol: openid-connect, protocolMapper: oidc-sub-mapper, config: { access.token.claim: "true", introspection.token.claim: "true" } }
          - name: email
            protocol: openid-connect
            protocolMapper: oidc-usermodel-attribute-mapper
            config: { user.attribute: email, claim.name: email, jsonType.label: String, id.token.claim: "true", access.token.claim: "true", userinfo.token.claim: "true" }
          - name: username
            protocol: openid-connect
            protocolMapper: oidc-usermodel-attribute-mapper
            config: { user.attribute: username, claim.name: preferred_username, jsonType.label: String, id.token.claim: "true", access.token.claim: "true", userinfo.token.claim: "true" }
          - name: groups
            protocol: openid-connect
            protocolMapper: oidc-usermodel-attribute-mapper
            config: { user.attribute: maas_groups, claim.name: groups, jsonType.label: String, multivalued: "true", aggregate.attrs: "true",
              id.token.claim: "true", access.token.claim: "true", userinfo.token.claim: "true" }
          - name: maas-orgs
            protocol: openid-connect
            protocolMapper: oidc-usermodel-attribute-mapper
            config: { user.attribute: maas_orgs, claim.name: "https://redhat\\.com/maas/orgs", jsonType.label: JSON, id.token.claim: "true", access.token.claim: "true", userinfo.token.claim: "true" }
    defaultDefaultClientScopes: [maas]
    clients:
      # The tenant client: the CLI (password grant) and the MaaS Portal's sign-in proxy (browser flow
      # with PKCE). bootstrap/36-portal-clients.sh adds each ingress spoke's portal callback.
      - { clientId: maas-cli, publicClient: true, directAccessGrantsEnabled: true, standardFlowEnabled: true, defaultClientScopes: [maas],
          attributes: { pkce.code.challenge.method: S256 } }
