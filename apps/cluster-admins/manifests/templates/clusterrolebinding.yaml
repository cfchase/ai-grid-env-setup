{{- /* Lifted from kahowell/ai-grid-tenant cluster-config/chart/templates/clusterrolebinding.yaml (55a3879), with permission. */ -}}
{{- if not .Values.cluster_admins }}
{{- fail "cluster-admins: values must define a non-empty 'cluster_admins' list" }}
{{- end }}
{{- range $user := .Values.cluster_admins }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-admin-{{ $user }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: {{ $user }}
{{- end }}
