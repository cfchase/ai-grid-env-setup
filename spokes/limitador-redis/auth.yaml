# Redis and Sentinel require a password, generated on the spoke once and kept there: Secret
# limitador-redis-auth (for Redis) and kuadrant-system/limitador-redis-url (Limitador's URL with it).
# Never in git, argv or logs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: limitador-redis-auth
  namespace: limitador-redis
  annotations: { argocd.argoproj.io/sync-wave: "0" }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: limitador-redis-auth
  namespace: limitador-redis
  annotations: { argocd.argoproj.io/sync-wave: "0" }
rules: [{ apiGroups: [""], resources: [secrets], verbs: [get, create, patch] }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: limitador-redis-auth
  namespace: limitador-redis
  annotations: { argocd.argoproj.io/sync-wave: "0" }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: limitador-redis-auth }
subjects: [{ kind: ServiceAccount, name: limitador-redis-auth, namespace: limitador-redis }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: limitador-redis-auth
  namespace: kuadrant-system
  annotations: { argocd.argoproj.io/sync-wave: "0" }
rules: [{ apiGroups: [""], resources: [secrets], resourceNames: [limitador-redis-url], verbs: [get, patch] }, { apiGroups: [""], resources: [secrets], verbs: [create] }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: limitador-redis-auth
  namespace: kuadrant-system
  annotations: { argocd.argoproj.io/sync-wave: "0" }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: limitador-redis-auth }
subjects: [{ kind: ServiceAccount, name: limitador-redis-auth, namespace: limitador-redis }]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: limitador-redis-auth
  namespace: limitador-redis
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: limitador-redis-auth
      restartPolicy: Never
      containers:
        - name: auth
          image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
          command:
            - /bin/bash
            - -ec
            - |
              if oc get secret limitador-redis-auth -n limitador-redis >/dev/null 2>&1; then
                echo "limitador-redis-auth exists; keeping it"
              else
                pw=$(tr -dc 'A-Za-z0-9' </dev/urandom | head -c 40)
                oc apply -n limitador-redis -f - <<YAML
              apiVersion: v1
              kind: Secret
              metadata: { name: limitador-redis-auth }
              type: Opaque
              stringData: { password: "$pw" }
              YAML
                echo "limitador-redis-auth created"
              fi
              pw=$(oc get secret limitador-redis-auth -n limitador-redis -o jsonpath='{.data.password}' | base64 -d)
              # This cluster's Redis. Another gateway's Limitador would use the exported name,
              # limitador-redis-master.limitador-redis.svc.clusterset.local.
              oc apply -n kuadrant-system -f - <<YAML
              apiVersion: v1
              kind: Secret
              metadata: { name: limitador-redis-url }
              type: Opaque
              stringData:
                URL: "redis://:$pw@limitador-redis-master.limitador-redis.svc.cluster.local:6379"
              YAML
              echo "limitador-redis-url rendered"
