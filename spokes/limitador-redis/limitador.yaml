apiVersion: v1
kind: Secret
metadata:
  name: limitador-redis
  namespace: kuadrant-system
  annotations: { argocd.argoproj.io/sync-wave: "2" }
type: Opaque
stringData:
  # This cluster's Redis. Another gateway's Limitador would use the exported name,
  # limitador-redis-master.limitador-redis.svc.clusterset.local.
  URL: redis://limitador-redis-master.limitador-redis.svc.cluster.local:6379
---
# Kuadrant owns this Limitador; Argo CD applies only spec.storage, server-side, and never prunes or
# deletes it.
apiVersion: limitador.kuadrant.io/v1alpha1
kind: Limitador
metadata:
  name: limitador
  namespace: kuadrant-system
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipPrune=true,Delete=false
spec:
  storage:
    redis:
      configSecretRef: { name: limitador-redis }
