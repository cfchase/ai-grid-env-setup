profile: maas
components:
  dashboard:
    dsc:
      standard: { managementState: Managed }
      maasPortal: { managementState: Managed }
  kserve:
    gateway:
      spec:
        listeners:
          - name: https
            port: 443
            protocol: HTTPS
            allowedRoutes:
              namespaces:
                from: Selector
                selector:
                  matchExpressions:
                    - { key: kubernetes.io/metadata.name, operator: In, values: [openshift-ingress, aigrid-models] }
  aigateway:
    modelsAsAService:
      gateway:
        spec:
          # Exposed by an OpenShift Route rather than an AWS load balancer: Policy maas-route creates
          # the parameters ConfigMap (ClusterIP Service with a serving certificate) and the Route,
          # whose host maas.<apps domain> it looks up on the spoke, so no host name is in git.
          infrastructure:
            parametersRef: { group: "", kind: ConfigMap, name: maas-gateway-options }
          listeners:
            - name: https
              port: 443
              protocol: HTTPS
              tls:
                mode: Terminate
                certificateRefs: [{ group: "", kind: Secret, name: maas-gw-service-tls }]
              allowedRoutes:
                namespaces:
                  from: Selector
                  selector:
                    matchExpressions:
                      # MaaS models in a grid are ExternalModels pointing at the grid gateway.
                      - { key: kubernetes.io/metadata.name, operator: In, values: [openshift-ingress, models-as-a-service, redhat-ai-gateway-infra] }
