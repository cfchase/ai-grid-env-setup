# Every spoke.
skipCrdCheck: true            # render every CR; Argo CD retries until the operator's CRDs exist
operator:
  type: rhoai
  rhoai:
    olm:
      source: rhoai-catalog-dev   # created by Policy rhoai-nightly-prereqs
      channel: stable-3.6
dependencies:
  # demo.redhat.com orders pre-install cert-manager with their own OperatorGroup; a second one
  # stops OLM in that namespace (Gaps 19). A spoke without cert-manager needs `auto` here.
  certManager: { enabled: false }
  # RHOAIENG-99507: ACM's observability add-on and the chart both install COO.
  clusterObservability: { enabled: false }
  # Monitoring below collects metrics only, so its traces and logs back ends stay out.
  tempo: { enabled: false }
  loki: { enabled: false }
services:
  # OpenShift AI's metrics, exported for ACM observability on the hub (apps/observability): the
  # hub's ScrapeConfig rhai-metrics federates port 8890, which Policy rhai-metrics opens to the
  # spoke's ACM metrics collector. ACM's add-on installs the Cluster Observability Operator.
  monitoring:
    dsci:
      managementState: Managed
      metrics:
        storage: { size: 20Gi }
        exporters:
          prometheus/rhacm: { endpoint: 0.0.0.0:8890 }
